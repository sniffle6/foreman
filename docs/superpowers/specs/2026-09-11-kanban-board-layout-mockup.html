<!doctype html>
<!-- THROWAWAY: compare compact, roomy, and narrow board layouts before implementing in egui. Open this file directly; no server or dependencies. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foreman · Board design study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--desk_bg);color:var(--text);font:13px 'Segoe UI',sans-serif}button,input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:7px 10px}button{cursor:pointer}button:hover{background:var(--sel_bg)}:focus-visible{outline:2px solid var(--border_focus);outline-offset:2px}button[aria-pressed=true]{background:var(--title_bg_focus);border-color:var(--border_focus)}header{padding:22px 28px;display:flex;align-items:center;gap:16px}h1{font-size:17px;margin:0}small,.muted{color:var(--dim)}header .controls{margin-left:auto;display:flex;align-items:center;gap:10px}.intro{padding:0 28px 20px;color:var(--dim);max-width:900px;line-height:1.6}.workspace{margin:0 28px;display:flex;gap:10px;height:calc(100vh - 235px);min-height:430px}.pane{background:var(--win_bg);border:1px solid var(--border);flex:1;min-width:0;display:flex;flex-direction:column}.chrome{padding:9px 12px;background:var(--title_bg);border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}.chrome strong{font-size:12px}.chrome small{margin-left:auto}.toolbar{padding:12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}.toolbar .summary{margin-right:auto;color:var(--dim)}.attention{color:var(--danger)}.board{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));overflow:auto;flex:1}.column{padding:12px;min-width:0;border-right:1px solid var(--border);overflow:auto}.column:last-child{border:0}.column h2{font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;margin:0 0 14px}.count{font-size:11px;font-weight:400;color:var(--dim)}.card{border:1px solid var(--border);border-radius:4px;background:var(--bg);margin-bottom:8px;overflow:hidden}.card-main{display:block;text-align:left;border:0;border-radius:0;background:transparent;width:100%;padding:11px 12px}.card-main:hover{background:var(--title_bg)}.title{font-size:13px;font-weight:600;line-height:1.5;min-height:39px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{display:block;color:var(--dim);font-size:11px;margin-top:6px}.reason{margin:0 12px 10px;color:var(--danger);font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card footer{display:flex;align-items:center;gap:6px;padding:0 10px 9px}.card footer button{font-size:11px;padding:4px 7px;background:transparent}.card footer .more{margin-left:auto}.empty{color:var(--dim);padding:18px 0;font-size:12px}.roomy .board{grid-template-columns:repeat(4,minmax(245px,1fr));gap:12px;padding:16px}.roomy .column{background:var(--bg);border:0;border-radius:6px;padding:12px}.roomy .card{background:var(--win_bg);margin-bottom:12px}.roomy .card-main{padding:15px}.roomy .title{font-size:15px;min-height:45px}.roomy .meta{margin-top:12px}.roomy .card footer{padding:12px;border-top:1px solid var(--border)}.roomy .reason{margin:0 15px 14px}.narrow .pane:first-child{flex:0 0 390px}.narrow .board{display:block}.narrow .column{border:0}.narrow .card{border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;padding-bottom:6px}.tabs{display:flex;border-bottom:1px solid var(--border);padding:8px;gap:4px}.tabs button{flex:1;font-size:11px;padding:7px 2px}.terminal{display:none}.narrow .terminal{display:flex;background:var(--bg)}pre{color:var(--dim);font:12px/1.9 Consolas,monospace;padding:18px;white-space:pre-wrap;margin:0}.terminal pre strong{color:var(--text)}.terminal-note{margin-top:auto;padding:16px;color:var(--dim);border-top:1px solid var(--border)}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--title_bg);border:1px solid var(--border_focus);border-radius:10px;display:flex;align-items:center;padding:6px;gap:5px;white-space:nowrap}.switcher span{padding:0 10px;color:var(--dim);font-size:11px}.switcher button{background:transparent}.status{padding:10px 28px;color:var(--dim);font-size:11px}dialog{background:var(--win_bg);color:var(--text);border:1px solid var(--border_focus);border-radius:8px;padding:24px;width:480px;max-width:90vw}dialog::backdrop{background:var(--dim_unfocused)}dialog h2{font-size:18px;line-height:1.4}dialog p{line-height:1.7}dialog .actions{display:flex;gap:8px;margin-top:18px}dialog input{width:100%}.close{float:right}#tokeninfo{font:11px/1.8 Consolas,monospace}.hide-done .board{grid-template-columns:repeat(3,minmax(210px,1fr))}.hide-done .column:last-child{display:none}@media(max-width:750px){header{padding:15px;flex-wrap:wrap}header .controls{margin-left:0}.workspace{margin:0 12px}.intro{padding:0 15px 12px}.terminal{display:none!important}.narrow .pane:first-child{flex:1}.switcher span{display:none}.switcher button{padding:7px}.toolbar{flex-wrap:wrap}}
</style>
<header><h1>Foreman <span class="muted">/ Board design study</span></h1><div class="controls"><label>Theme <select id="theme"><option value="warm">Foreman Warm</option><option value="custom">Saved custom theme</option><option value="light">Light · test palette</option></select></label><button id="tokens">Tokens</button><button id="reset">Reset demo</button></div></header>
<div class="intro" id="intro"></div><main class="workspace" id="workspace"></main><div class="status" id="status" aria-live="polite">Prototype · sample data only · actions stay in this page</div>
<nav class="switcher" aria-label="Prototype variations"><span>LAYOUT STUDY</span><button id="prev" aria-label="Previous variant">←</button><button data-variant="A">A · Compact</button><button data-variant="B">B · Roomier</button><button data-variant="C">C · Narrow pane</button><button id="next" aria-label="Next variant">→</button></nav><dialog id="detail"></dialog>
<script>
const warm={bg:'#14120f',desk_bg:'#191713',win_bg:'#211e18',title_bg:'#2b271f',title_bg_focus:'#383124',text:'#deded4',dim:'#968f7d',border:'#3c3c3c',border_focus:'#e7e7e7',sel_bg:'rgba(231,231,231,.118)',danger:'#d66654',dim_unfocused:'rgba(0,0,0,.18)'};
const themes={warm,custom:{...warm,bg:'#0c1518',border_focus:'#b3f3ff',sel_bg:'rgba(230,230,230,.118)'},light:{bg:'#fffdf8',desk_bg:'#eae6de',win_bg:'#f5f1e9',title_bg:'#e9e3d8',title_bg_focus:'#d9d1c2',text:'#29251f',dim:'#686054',border:'#c5bdb0',border_focus:'#494137',sel_bg:'rgba(41,37,31,.08)',danger:'#a33627',dim_unfocused:'rgba(41,37,31,.25)'}};
const seed=[{id:'KB-104',title:'Keep card actions stable while hovering',state:0,body:'Give each card a stable action footer. Keep the full title width unchanged as the pointer crosses a card.'},{id:'KB-105',title:'Show the complete task brief before dispatch',state:0,body:'Open a lightweight detail view with the full task description and the selected agent before starting work.'},{id:'KB-106',title:'Verify long task titles at small pane widths',state:0,body:'Check two-line titles, clipped metadata, and keyboard access when the board sits beside a terminal.'},{id:'KB-101',title:'Use shared theme tokens throughout the board',state:1,agent:'codex',terminal:'term-12',body:'Use the existing Theme surface, text, border, selection, and danger tokens. Verify the entire board in contrasting palettes.'},{id:'KB-102',title:'Improve keyboard navigation between cards',state:1,agent:'claude',terminal:'term-09',body:'Make all visible card controls reachable from the keyboard with a clear focus indication.'},{id:'KB-103',title:'Restore board selection after reopening the project',state:1,ended:true,body:'The previous worker session has ended. Restart the task with a new agent or return it to the backlog.'},{id:'KB-099',title:'Choose the behavior for completed cards',state:2,reason:'Decision needed: keep all completed cards visible, or collapse Done by default?',body:'The board gets crowded during long sessions. Choose a default presentation for completed work before implementing.'},{id:'KB-097',title:'Link each running card to its terminal',state:3,body:'Clicking Open terminal surfaces the session associated with the card.'},{id:'KB-098',title:'Keep column counts visible',state:3,body:'Column headers include a count of the cards in that state.'}];
let cards=structuredClone(seed),variant=new URLSearchParams(location.search).get('variant')||'A',tab=1,hideDone=false;
if(!['A','B','C'].includes(variant))variant='A';
const states=['Backlog','In Progress','Blocked','Done'],$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function palette(){Object.entries(themes[$('#theme').value]).forEach(([k,v])=>document.documentElement.style.setProperty('--'+k,v))}
function report(message){$('#status').textContent='Prototype · '+message+' · '+cards.length+' cards · changes are in memory only'}
function card(c){const action=c.ended?'Restart…':c.state===0||c.state===2?'Start…':c.state===1?'Open terminal':'View result';return `<article class="card"><button class="card-main" data-detail="${c.id}"><span class="title">${esc(c.title)}</span><span class="meta">${c.state===1&&!c.ended?esc(c.agent+' · '+c.terminal):c.ended?'Session ended':c.state===2?'Needs your input':c.state===3?'Completed':'Ready to start'}</span></button>${c.reason||c.ended?`<p class="reason">${esc(c.reason||'Worker is no longer connected.')}</p>`:''}<footer><button data-action="${c.id}">${action}</button><button class="more" aria-label="More actions for ${esc(c.title)}" data-detail="${c.id}">•••</button></footer></article>`}
function render(){palette();const narrow=variant==='C';$('#intro').textContent={A:'A / Compact — four lanes, quiet card surfaces, stable action footers. Built for scanning a busy project.',B:'B / Roomier — separated lanes, larger titles, stronger card boundaries. Built for reading the work before starting it.',C:'C / Narrow pane — one state at a time beside a terminal. Counts stay visible; the selected lane gets the full pane width.'}[variant];$('#workspace').className='workspace '+(narrow?'narrow':variant==='B'?'roomy':'compact')+(!narrow&&hideDone?' hide-done':'');$('#workspace').innerHTML=`<section class="pane"><div class="chrome"><strong>foreman / Board</strong><small>project work</small></div><div class="toolbar"><span class="summary"><span class="attention">${cards.filter(c=>c.ended||c.state===2).length} need attention</span> · ${cards.filter(c=>c.state===1&&!c.ended).length} running</span><button id="add">+ New card</button>${narrow?'':`<button id="collapse">${hideDone?'Show':'Hide'} Done</button>`}</div>${narrow?`<nav class="tabs">${states.map((s,i)=>`<button data-tab="${i}" aria-pressed="${i===tab}">${s} ${cards.filter(c=>c.state===i).length}</button>`).join('')}</nav>`:''}<div class="board">${states.map((s,i)=>narrow&&tab!==i?'':`<section class="column"><h2>${s}<span class="count">${cards.filter(c=>c.state===i).length}</span></h2>${cards.filter(c=>c.state===i).map(card).join('')||'<div class="empty">No cards here.</div>'}</section>`).join('')}</div></section><aside class="pane terminal"><div class="chrome"><strong>codex · term-12</strong><small>Sample terminal</small></div><pre><strong>› Use shared theme tokens throughout the board</strong>\n\nInspecting src/board.rs and src/theme.rs…\n\nThe board reads Theme through theme::live(ctx).\nMapping the proposed card surfaces:\n\n  board surface       win_bg\n  card surface        bg\n  title / metadata    text / dim\n  hover               sel_bg\n  focus outline       border_focus\n  needs attention     danger\n\n<strong>Next: check the narrow pane layout.</strong>\n\n▌</pre><div class="terminal-note">Terminal context is illustrative. Demo actions do not start agents.</div></aside>`;document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));}
function switchVariant(v){variant=v;const u=new URL(location);u.searchParams.set('variant',v);history.replaceState(null,'',u);render();report('Viewing '+v)}
function modal(html){$('#detail').innerHTML='<button class="close" id="close">Close</button>'+html;$('#detail').showModal()}
function detail(c){modal(`<small>${c.id} · ${states[c.state]}</small><h2>${esc(c.title)}</h2><p>${esc(c.body)}</p>${c.reason?`<p class="attention">${esc(c.reason)}</p>`:''}<div class="actions"><button data-action="${c.id}">${c.ended?'Restart…':c.state===0||c.state===2?'Start…':c.state===1?'Open terminal':'View result'}</button>${c.ended?`<button data-release="${c.id}">Return to backlog</button>`:''}<button data-delete="${c.id}">Delete card</button></div>`)}
function act(c){if(c.state===0||c.state===2||c.ended){modal(`<small>${c.id}</small><h2>Start with an agent</h2><p>${esc(c.title)}</p><div class="actions">${['claude','codex','grok'].map(a=>`<button data-start="${c.id}" data-agent="${a}">${a}</button>`).join('')}</div><p class="muted">Demo only. This updates the sample card.</p>`)}else{if($('#detail').open)$('#detail').close();modal(`<small>${c.id}</small><h2>${c.state===3?'Completed task':'Linked terminal'}</h2><p>${c.state===3?esc(c.body):esc(c.agent+' · '+c.terminal)+' — the native board would bring this session into focus.'}</p>`);report(c.state===3?'Opened completed task':'Previewed terminal link')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,c=cards.find(c=>c.id===(d.detail||d.action||d.start||d.release||d.delete));if(d.variant)switchVariant(d.variant);if(d.tab){tab=+d.tab;render()}if(d.detail)detail(c);if(d.action)act(c);if(d.start){Object.assign(c,{state:1,agent:d.agent,terminal:'term-demo',ended:false,reason:null});$('#detail').close();tab=1;render();report('Started '+c.id+' with '+d.agent)}if(d.release){c.state=0;c.ended=false;$('#detail').close();render();report('Returned '+c.id+' to Backlog')}if(d.delete){cards=cards.filter(x=>x!==c);$('#detail').close();render();report('Deleted '+c.id+' (Reset demo restores it)')}if(b.id==='close')$('#detail').close();if(b.id==='collapse'){hideDone=!hideDone;render()}if(b.id==='reset'){cards=structuredClone(seed);render();report('Reset all sample cards')}if(b.id==='add')modal('<h2>New card</h2><form id="newcard"><label>Task title<input name="title" required autofocus placeholder="What should the agent work on?"></label><div class="actions"><button>Create card</button></div></form>');if(b.id==='tokens')modal('<h2>Shared theme tokens</h2><p>Warm values come from src/theme.rs. Custom values mirror the saved theme (selection alpha is unpremultiplied for CSS). Light is a proposed test palette, not an existing Foreman preset.</p><div id="tokeninfo">'+Object.entries(themes[$('#theme').value]).map(([k,v])=>esc(k)+' &nbsp; '+esc(v)).join('<br>')+'</div>');if(b.id==='prev'||b.id==='next')switchVariant(['A','B','C'][(variant.charCodeAt(0)-65+(b.id==='next'?1:2))%3])});
document.addEventListener('submit',e=>{if(e.target.id!=='newcard')return;e.preventDefault();const title=new FormData(e.target).get('title').trim();if(!title)return;cards.push({id:'KB-demo-'+Date.now(),title,state:0,body:'Title-only card created in this prototype.'});tab=0;$('#detail').close();render();report('Created a Backlog card')});
document.addEventListener('keydown',e=>{if($('#detail').open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();$('#'+(e.key==='ArrowRight'?'next':'prev')).click()}});$('#theme').onchange=()=>{palette();report('Theme: '+$('#theme').selectedOptions[0].text)};render();
</script></html>
