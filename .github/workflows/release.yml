name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "install.ps1"
  workflow_dispatch:

permissions:
  contents: write
  actions: read # the test gate reads test.yml's runs

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Match local builds (GNU, not MSVC) so release binaries don't
      # silently differ from what gets tested. Spec §1 requires empirically
      # verifying this link step on the runner.
      - name: Use GNU toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV

      - name: Read version from Cargo.toml
        id: ver
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Tag must match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ('v${{ steps.ver.outputs.version }}' -ne '${{ github.ref_name }}') {
            throw "tag ${{ github.ref_name }} != Cargo.toml v${{ steps.ver.outputs.version }}"
          }

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $zip = "foreman-v$v-x86_64-windows.zip"
          New-Item -ItemType Directory staging | Out-Null
          Copy-Item target/release/foreman.exe staging/
          Copy-Item target/release/foreman-cli.exe staging/foreman.com
          # Legacy launcher: the v0.5.5 updater refuses a zip without it.
          Copy-Item target/release/foreman-gui.exe staging/
          Copy-Item LICENSE-MIT, LICENSE-APACHE staging/
          Copy-Item assets/fonts/LICENSE-Hack.md staging/THIRD-PARTY-Hack-font.md
          Copy-Item assets/conpty/LICENSE staging/THIRD-PARTY-ConPTY.txt
          Compress-Archive -Path staging/* -DestinationPath $zip
          $h = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$h  $zip" | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Subsystem and PowerShell CLI smoke
        run: |
          # PE optional-header Subsystem: 2 = GUI (no console window), 3 = console.
          function Subsystem($path) {
            $b = [IO.File]::ReadAllBytes((Resolve-Path $path))
            $pe = [BitConverter]::ToInt32($b, 0x3c)
            [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          }
          if ((Subsystem staging/foreman.exe) -ne 2) { throw 'foreman.exe must be GUI-subsystem: a console one opens a console window on launch' }
          if ((Subsystem staging/foreman.com) -ne 3) { throw 'foreman.com must be console-subsystem: PowerShell only waits for console executables' }
          & staging/foreman.com kanban --help
          if ($LASTEXITCODE -ne 0) { throw "help exited $LASTEXITCODE" }
          & staging/foreman.com kanban nonsense
          if ($LASTEXITCODE -ne 2) { throw "bad command exited $LASTEXITCODE" }
          $helpText = & staging/foreman.com kanban --help
          if (($helpText -join "`n") -notmatch 'foreman kanban wait') { throw 'help text missing from stdout' }

      - name: Upload dry-run artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            foreman-v*-x86_64-windows.zip
            SHA256SUMS.txt

      # Tests are test.yml's job. It runs on every push to main, so it has
      # already run, or is running, on this exact commit. This workflow used
      # to run `cargo test` again on the same commit and runner image: no new
      # coverage, only a second chance for a flaky test to block a publish
      # (v0.7.1: test.yml green, this run red, same commit). Now a tag
      # publishes only once test.yml has passed on its commit; the gate sits
      # after the build so the two overlap. Dry runs (PR, workflow_dispatch)
      # skip it.
      # A failed or cancelled test.yml run (a newer push to main cancels one
      # in flight) fails the gate: re-run that run, then this one.
      - name: test.yml must pass on this commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $appear = (Get-Date).AddMinutes(10)
          $finish = (Get-Date).AddMinutes(60)
          while ($true) {
            $run = gh run list --workflow test.yml --branch $env:BRANCH --commit $env:SHA `
              --limit 1 --json status,conclusion,url | ConvertFrom-Json | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { throw "gh run list exited $LASTEXITCODE" }
            if (-not $run) {
              if ((Get-Date) -gt $appear) { throw "no test.yml run on $env:BRANCH for $env:SHA after 10 min" }
            } elseif ($run.status -eq 'completed') {
              if ($run.conclusion -eq 'success') { "test.yml passed: $($run.url)"; break }
              throw "test.yml $($run.conclusion) on ${env:SHA}: $($run.url) - re-run it, then re-run this workflow"
            } elseif ((Get-Date) -gt $finish) {
              throw "test.yml still $($run.status) after 60 min: $($run.url)"
            }
            Start-Sleep -Seconds 30
          }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            "foreman-v${{ steps.ver.outputs.version }}-x86_64-windows.zip" `
            SHA256SUMS.txt `
            --generate-notes
