[package]
name = "foreman"
version = "0.2.9"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sniffle6/foreman"
description = "Fast native desktop for running many AI-agent terminal sessions"

[dependencies]
alacritty_terminal = "0.26.0"
arboard = "3.6.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.34.3"
interprocess = "2"
png = "0.17"
portable-pty = "0.9.0"
resvg = { version = "0.45", default-features = false }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
# Update check only: blocking HTTP on a plain thread, rustls default.
# NOTE: default TLS roots are webpki, NOT the Windows cert store -- corporate
# MITM proxies fail the check; that is absorbed by silent-skip (spec Deps section).
ureq = "3"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
# Color emoji raster (DirectWrite + D2D → WIC bitmap). Not the same crate as windows-sys.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }
# Used by D2D DrawTextLayout origin (Vector2); already a windows crate dep.
windows-numerics = "0.3"

[dev-dependencies]
tempfile = "3"
